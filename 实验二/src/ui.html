<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consumer Insight · 实验二</title>
  <style>
    :root { font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; background: #f3f6f8; color: #203442; }
    * { box-sizing: border-box; } body { margin: 0; }
    header { background: #163f51; color: white; padding: 30px max(24px, calc((100vw - 1040px)/2)); }
    header small { letter-spacing: .16em; color: #a9d2d4; font-weight: bold; } h1 { margin: 8px 0; font-size: 34px; }
    header p { margin: 0; color: #d4e5e8; }
    main { max-width: 1040px; margin: 26px auto; padding: 0 20px; }
    section { background: white; border: 1px solid #dce7eb; border-radius: 14px; padding: 24px; margin-bottom: 18px; box-shadow: 0 8px 25px #1539480b; }
    h2 { margin: 0 0 8px; font-size: 21px; } .hint { margin: 0 0 18px; color: #5d7280; font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 14px; }
    label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 7px; }
    input { width: 100%; border: 1px solid #cad9df; border-radius: 8px; min-height: 42px; padding: 8px 10px; font: inherit; }
    input[type=file] { font-size: 13px; } button { background: #0b8073; border: 0; border-radius: 8px; padding: 11px 20px; color: white; font: inherit; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .6; } .actions { display: flex; gap: 14px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
    .note { color: #6a7f87; font-size: 12px; } .message { padding: 12px; border-radius: 8px; margin-top: 15px; }
    .error { background: #fff0f0; color: #8b2531; } .ok { background: #e7f6ef; color: #17634d; }
    .toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 10px 0 18px; }
    .toolbar a { color: #0a6b6d; font-weight: bold; } .meta { color: #627986; font-size: 13px; }
    .scroll { overflow-x: auto; } table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
    th, td { text-align: left; border-bottom: 1px solid #e3ebee; padding: 10px; vertical-align: top; }
    th { background: #f5f9fa; } td.review { min-width: 160px; } .unknown { color: #81929a; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f5f8fa; border: 1px solid #e3eaed; border-radius: 8px; padding: 14px; max-height: 350px; overflow: auto; }
    [hidden] { display: none !important; } @media(max-width:700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header><small>CONSUMER INSIGHT / V0.2</small><h1>评论洞察标注</h1><p>基于原文证据的固定规则分析，无法判断时输出 unknown。</p></header>
<main>
  <section><h2>上传 reviews.csv</h2><p class="hint">必需列：review_id、review；请使用 UTF-8 编码。数据仅在本机处理。</p>
    <form id="form"><div class="grid">
      <div><label for="file">CSV 文件</label><input id="file" type="file" accept=".csv,text/csv" required></div>
      <div><label for="source">数据来源</label><input id="source" placeholder="如：课程自建样例" required></div>
      <div><label for="date">采集日期</label><input id="date" type="date" required></div>
    </div><div class="actions"><button id="submit" type="submit">上传并分析</button><span class="note">原始文件独立留存，不覆盖、不修改。</span></div></form>
    <div id="message" class="message" role="alert" hidden></div>
  </section>
  <section id="results" hidden><h2>结构化结果</h2><div class="toolbar"><span id="count"></span><a id="download" download="consumer-insight-v0.2.json" href="#">下载 JSON</a><span id="meta" class="meta"></span></div>
    <div class="scroll"><table><thead><tr><th>编号</th><th>原评论</th><th>情感</th><th>需求</th><th>痛点</th><th>场景</th><th>购买障碍</th><th>证据</th><th>置信标记</th></tr></thead><tbody id="rows"></tbody></table></div>
    <h3>JSON 预览</h3><pre id="json"></pre>
  </section>
</main>
<script>
  const $ = id => document.getElementById(id); let downloadUrl = null;
  const now = new Date(); $('date').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  function notice(text, type) { const el = $('message'); el.textContent = text; el.className = 'message ' + type; el.hidden = false; }
  $('form').addEventListener('submit', async event => {
    event.preventDefault(); const file = $('file').files[0];
    if (!file) return notice('请选择 CSV 文件。', 'error');
    if (file.size > 5 * 1024 * 1024) return notice('CSV 文件不能超过 5 MB。', 'error');
    const button = $('submit'); button.disabled = true; button.textContent = '分析中…'; $('message').hidden = true;
    try {
      const response = await fetch('/api/analyze', {method:'POST', headers:{'Content-Type':'text/csv',
        'X-Data-Source':encodeURIComponent($('source').value), 'X-Collection-Date':$('date').value,
        'X-File-Name':encodeURIComponent(file.name)}, body:file});
      const payload = await response.json();
      if (!response.ok) { $('results').hidden = true; return notice(payload.error || '分析失败。', 'error'); }
      const analysis = payload.analysis; $('results').hidden = false;
      $('count').textContent = `记录 ${analysis.records.length} 条`;
      $('meta').textContent = `来源：${payload.metadata.source} · 日期：${payload.metadata.collection_date}`;
      const tbody = $('rows'); tbody.replaceChildren();
      for (const record of analysis.records) {
        const tr = document.createElement('tr');
        const values = [record.review_id,record.review,record.sentiment,record.need,record.pain_point,record.scenario,record.purchase_barrier,JSON.stringify(record.evidence),record.confidence];
        values.forEach((value,index) => { const td=document.createElement('td'); td.textContent=value; if(index===1) td.className='review'; if(value==='unknown') td.className='unknown'; tr.appendChild(td); }); tbody.appendChild(tr);
      }
      const json = JSON.stringify(analysis,null,2); $('json').textContent = json;
      if (downloadUrl) URL.revokeObjectURL(downloadUrl);
      downloadUrl = URL.createObjectURL(new Blob([json],{type:'application/json'})); $('download').href=downloadUrl;
      notice('分析完成；证据字段均引用原评论。', 'ok');
    } catch (error) { $('results').hidden=true; notice('连接失败：请确认程序正在运行。','error'); }
    finally { button.disabled=false; button.textContent='上传并分析'; }
  });
</script>
</body></html>
