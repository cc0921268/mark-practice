<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实验七 · 营销 Workflow</title><style>
:root{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#183747;background:#f3f7f8}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#123549,#176b73);color:#fff;padding:36px max(22px,calc((100vw - 1050px)/2))}h1{margin:8px 0;font-size:34px}header p{margin:0;color:#d6e9e9}header small{letter-spacing:.14em;color:#a8d5d5;font-weight:700}main{max-width:1050px;margin:25px auto 65px;padding:0 18px}.card{background:#fff;border:1px solid #dce8e9;border-radius:14px;padding:23px;margin-bottom:18px;box-shadow:0 8px 24px #143d490b}h2{font-size:21px;margin:0 0 8px}.muted{font-size:13px;color:#617984;line-height:1.6}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:13px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 6px}input{width:100%;min-height:42px;border:1px solid #c9d9dd;border-radius:8px;padding:9px;font:inherit}button{border:0;border-radius:8px;background:#0b8274;color:#fff;padding:11px 19px;font:inherit;font-weight:700;cursor:pointer;margin-top:17px}button:disabled{opacity:.6}.alert{background:#fff4e1;border:1px solid #ecd1a0;border-radius:9px;color:#765c2b;padding:12px;font-size:13px;margin:14px 0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:17px 0}.step{background:#eff6f6;border-radius:9px;padding:12px;font-size:13px}.step strong{display:block;margin-bottom:5px;color:#0c626a}.ok{color:#12664e}.message{padding:12px;border-radius:8px;margin-top:13px}.error{background:#fff0f0;color:#872835}.success{background:#e5f6ee;color:#145b48}.campaign{background:#f5faf8;border:1px solid #deebe6;border-radius:10px;padding:16px}.campaign p{line-height:1.6}.campaign h3{margin:0 0 9px}.code{font-family:Consolas,monospace;background:#eef3f5;padding:3px 6px;border-radius:4px;word-break:break-all}@media(max-width:750px){.grid,.steps{grid-template-columns:1fr}}
</style></head><body><header><small>MARKETING WORKFLOW / V0.7</small><h1>蓝牙耳机新品推广流程</h1><p>九步状态传递 · API 调用 · JSON 校验 · 证据留痕 · 人工审核</p></header><main>
<section class="card"><h2>发起策划</h2><p class="muted">填写需求、输入来源及日期。本地模拟 API 演示程序—API—模型—JSON—程序链路，不调用外部大模型。原始输入另存，不覆盖历史运行。</p><form id="form"><div class="grid"><div><label for="request">推广需求</label><input id="request" value="给蓝牙耳机设计一次新品推广" required></div><div><label for="source">输入来源</label><input id="source" value="课程个人作业" required></div><div><label for="date">日期</label><input id="date" type="date" required></div></div><button id="start">运行 Workflow</button></form><div id="message" class="message" hidden></div></section>
<section class="card"><h2>运行状态</h2><p class="muted">每步的输入、输出、状态与证据来源保存在项目内独立运行目录。</p><div id="summary" class="alert">尚未显示运行结果。</div><div id="steps" class="steps"></div></section>
<section class="card"><h2>Campaign 草案</h2><div class="alert">对外发布前需人工审核：产品事实、预算、渠道资源、证据与合规。页面只展示待审核草案，不自动批准或发布。</div><div id="campaign" class="campaign">等待运行。</div></section>
</main><script>
const $=id=>document.getElementById(id);const now=new Date();$('date').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;const names={brand_profile:'品牌资料',consumer_insight:'消费者洞察',competitive_analysis:'竞争分析',content_gap:'Content Gap',brand_voice:'Brand Voice',target_consumer:'目标消费者',communication_theme:'传播主题',channel_plan:'渠道计划',campaign:'Campaign'};
function render(payload){if(!payload||!payload.state)return;const state=payload.state;$('summary').textContent=`运行编号：${state.run_id} · 状态：${state.status} · 人工审核：${state.human_review}`;const steps=$('steps');steps.replaceChildren();for(const [key,value] of Object.entries(state.steps)){const box=document.createElement('div');box.className='step';const title=document.createElement('strong');title.textContent=names[key]||key;const detail=document.createElement('span');detail.textContent=`${value.status} · ${value.file}`;box.append(title,detail);steps.appendChild(box)}const campaign=$('campaign');campaign.replaceChildren();if(payload.campaign){const c=payload.campaign;const title=document.createElement('h3');title.textContent=c.name;campaign.appendChild(title);for(const [label,value] of [['目标',c.objective],['人群',c.audience],['传播主题',c.theme],['指标',c.metric],['原评论证据 ID',c.evidence_ids.join('、')],['竞品商品 ID',c.competitor_listing_ids.join('、')],['边界',c.claim_boundary],['审核状态',c.approval_status]]){const p=document.createElement('p');p.textContent=`${label}：${value}`;campaign.appendChild(p)}const h=document.createElement('h4');h.textContent='渠道';campaign.appendChild(h);for(const channel of c.channels){const p=document.createElement('p');p.textContent=`${channel.name}：${channel.role}；指标 ${channel.metric}`;campaign.appendChild(p)}}}
fetch('/api/latest').then(r=>r.json()).then(render);$('form').addEventListener('submit',async e=>{e.preventDefault();const b=$('start');b.disabled=true;b.textContent='运行中…';const msg=$('message');msg.hidden=true;try{const response=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request:$('request').value,source:$('source').value,collection_date:$('date').value})});const body=await response.json();if(!response.ok)throw new Error(body.error);const latest=await fetch('/api/latest').then(r=>r.json());render(latest);msg.className='message success';msg.textContent='运行完成；Campaign 草案待人工审核。';msg.hidden=false}catch(error){msg.className='message error';msg.textContent=error.message;msg.hidden=false}finally{b.disabled=false;b.textContent='运行 Workflow'}});
</script></body></html>
